name: CI

# Builds the dbt project against a throwaway Postgres on every push and PR:
# load the real schema (sql/init.sql), add a few synthetic rows
# (ci/sample_metrics.sql), then run every dbt model and test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15 # same major version as docker-compose.yaml
        env:
          POSTGRES_USER: mediapulse
          POSTGRES_PASSWORD: mediapulse
          POSTGRES_DB: mediapulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediapulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: mediapulse
      PGPASSWORD: mediapulse
      PGDATABASE: mediapulse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catch syntax errors in the DAG, backfill script and dashboard
      # without installing Airflow (which is heavy).
      - name: Compile Python sources
        run: python -m py_compile dags/*.py scripts/*.py streamlit/*.py

      - name: Install dbt
        run: pip install "dbt-core~=1.11.0" dbt-postgres

      - name: Load schema and fixture data
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/init.sql
          psql -v ON_ERROR_STOP=1 -f ci/sample_metrics.sql

      - name: dbt build (models + tests)
        working-directory: media_pulse
        run: dbt build --profiles-dir ../ci
